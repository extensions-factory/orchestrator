<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #202124;
    --muted: #5f6368;
    --line: #d8dce3;
    --accent: #0759c7;
    --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015;
      --panel: #171a22;
      --text: #edf1f7;
      --muted: #aeb7c5;
      --line: #343b49;
      --accent: #70d6ff;
      --code: #0a0c10;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; padding: 48px 24px; color: var(--text); background: var(--bg); font: 17px/1.65 system-ui, sans-serif; }
  main { max-width: 75ch; margin: auto; padding: clamp(24px, 5vw, 48px); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  h1, h2, h3 { line-height: 1.2; text-wrap: balance; }
  h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 3rem); }
  h2 { margin-top: 2.5rem; padding-top: 0.5rem; border-top: 1px solid var(--line); }
  p, li { max-width: 70ch; }
  a { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .skip-link { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 8px 12px; transform: translateY(-150%); color: var(--panel); background: var(--text); }
  .skip-link:focus { transform: translateY(0); }
  code, pre { font-family: ui-monospace, monospace; }
  :not(pre) > code { padding: 0.1em 0.3em; border-radius: 4px; background: var(--code); }
  pre { overflow: auto; padding: 16px; border-radius: 9px; background: var(--code); }
  blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--muted); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.94rem; }
  th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-weight: 650; }
  @media (max-width: 600px) { body { padding: 0; } main { border: 0; border-radius: 0; } }
  @media print {
    :root { --bg: #fff; --panel: #fff; --text: #000; --muted: #444; --line: #bbb; }
    body { padding: 0; font-size: 11pt; }
    main { max-width: none; padding: 0; border: 0; }
    .skip-link { display: none; }
    a { color: inherit; }
    pre, blockquote { break-inside: avoid; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<main id="main-content" tabindex="-1">
{{CONTENT}}
</main>
</body>
</html>
