<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; --bg:#0e1015; --panel:#171a22; --text:#edf1f7; --muted:#9ca7b7; --line:#2b3240; }
  * { box-sizing: border-box; }
  body { max-width: 960px; margin: auto; padding: 48px 24px; color: var(--text); background: var(--bg); font: 16px/1.65 system-ui, sans-serif; }
  main { padding: 32px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  h1, h2, h3 { line-height: 1.2; }
  a { color: #70d6ff; }
  code, pre { font-family: ui-monospace, monospace; }
  pre { overflow: auto; padding: 16px; border-radius: 9px; background: #0a0c10; }
  blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--muted); color: var(--muted); }
</style>
</head>
<body>
<main>
{{CONTENT}}
</main>
</body>
</html>
